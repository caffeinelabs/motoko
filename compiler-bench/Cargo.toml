[package]
name = "motoko-compiler-bench"
version = "0.1.0"
edition = "2021"
description = "Benchmark harness for the Motoko compiler (moc)"

[[bin]]
name = "motoko-compiler-bench"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
toml = "0.8"

[profile.release]
opt-level = 0
