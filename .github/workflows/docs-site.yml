name: docs-site

# doc/md is watched too: it is symlinked in as doc/site/src/content/docs, and
# doc/md/examples supplies the `file=` code-fence includes.
on:
  pull_request:
    paths:
    - 'doc/site/**'
    - 'doc/md/**'
    - '.github/workflows/docs-site.yml'
  push:
    branches:
    - master
    paths:
    - 'doc/site/**'
    - 'doc/md/**'
    - '.github/workflows/docs-site.yml'

permissions:
  contents: read

jobs:
  # Not named `build`: that is build.yml's job name, and the two are
  # indistinguishable in the checks list.
  docs-site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: doc/site
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: doc/site/package-lock.json
    - run: npm ci
    - run: npm run build
