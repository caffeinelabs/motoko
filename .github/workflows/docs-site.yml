name: docs-site

# doc/md is watched too: it is symlinked in as doc/site/src/content/docs, and
# doc/md/examples supplies the `file=` code-fence includes.
on:
  pull_request:
    paths:
    - 'doc/site/**'
    - 'doc/md/**'
    - '.github/workflows/docs-site.yml'
  push:
    branches:
    - master
    paths:
    - 'doc/site/**'
    - 'doc/md/**'
    - '.github/workflows/docs-site.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: doc/site
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: doc/site/package-lock.json
    - run: npm ci
    - run: npm run build
