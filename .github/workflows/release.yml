name: release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    # To test this workflow: Go to Actions -> release -> Run workflow
    # Or using the CLI: gh workflow run release --ref <branch> -f base_version=2.0.0 -f version_suffix=beta.0
    # This creates a draft release tagged with the computed version
    # Remember to delete the draft release after testing!
    inputs:
      base_version:
        description: "Base version, e.g. 2.0.0 (default: first version in Changelog.md)"
        required: false
        default: ""
        type: string
      version_suffix:
        description: "Prerelease suffix, e.g. beta.0. Empty for an official release."
        required: false
        default: test-draft-release
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # Resolve the version once, so every job agrees on it.
  #
  # The version is `<base>[-<suffix>]`, where the base is either the
  # `base_version` input or the first version in Changelog.md, and the suffix is
  # the `version_suffix` input. It is used as the release tag, as the artifact
  # filenames, and as the version the built compiler reports via `moc --version`.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release_version.outputs.version }}
      suffix: ${{ steps.release_version.outputs.suffix }}
      skip: ${{ steps.already_released.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Abort if tag is not on master
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          git fetch origin master
          if git merge-base --is-ancestor "${GITHUB_SHA}" "origin/master"; then
            echo "Tag commit ${GITHUB_SHA} is reachable from master."
          else
            echo "Error: Tag commit ${GITHUB_SHA} is not on master. Aborting workflow."
            exit 1
          fi

      # A dispatch names the version in its inputs; a tag names it in the ref.
      # Official releases take their base from Changelog.md so that the version
      # cannot drift from the released changelog section.
      - name: Determine version inputs
        id: version_inputs
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          BASE: ${{ inputs.base_version }}
          SUFFIX: ${{ inputs.version_suffix }}
        run: |
          set -eu
          if [ "$EVENT" = "workflow_dispatch" ]; then
            base="$BASE"; suffix="$SUFFIX"
          elif printf '%s' "$REF" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            # Official release tag: base comes from Changelog.md.
            base=""; suffix=""
          elif printf '%s' "$REF" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-.+$'; then
            # Prerelease tag, e.g. 2.0.0-beta.0.
            base="${REF%%-*}"; suffix="${REF#*-}"
          else
            echo "::error::Cannot derive a version from ref '${REF}'."
            exit 1
          fi
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "suffix=${suffix}" >> "$GITHUB_OUTPUT"

      - name: Compute release version
        id: release_version
        uses: ./.github/actions/release-version
        with:
          base_version: ${{ steps.version_inputs.outputs.base }}
          version_suffix: ${{ steps.version_inputs.outputs.suffix }}

      # Guard against the changelog and the tag disagreeing: a tag that resolves
      # to a different version would otherwise publish misnamed artifacts.
      - name: Check the computed version matches the tag
        if: ${{ github.event_name == 'push' }}
        env:
          VERSION: ${{ steps.release_version.outputs.version }}
          REF: ${{ github.ref_name }}
        run: |
          set -eu
          if [ "$VERSION" != "$REF" ]; then
            echo "::error::Computed version '${VERSION}' does not match tag '${REF}'; is Changelog.md out of sync?"
            exit 1
          fi

      - run: echo "Preparing release ref=${{ github.ref_name }} version=${{ steps.release_version.outputs.version }}"

      # Publishing a draft release creates its tag, which fires this workflow
      # again as a `push`; that run must not rebuild or re-upload an already
      # complete release. A tag whose release is published is skipped, while a
      # dispatch can still build its own draft.
      - name: Check whether this version is already released
        id: already_released
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          set -eu
          skip=false
          if json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${VERSION}" 2>/dev/null)"; then
            if [ "$(printf '%s' "$json" | jq -r '.draft')" = "false" ]; then
              echo "::notice::${VERSION} is already published; skipping the rebuild."
              skip=true
            fi
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

  # The release body. Official releases show their changelog section; a
  # prerelease has no such section, so it shows the unreleased entries instead.
  changelog:
    runs-on: ubuntu-latest
    needs: prepare
    if: ${{ needs.prepare.outputs.skip != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract changelog
        id: read_changelog
        uses: ./.github/actions/extract-changelog
        with:
          version: ${{ needs.prepare.outputs.version }}
          mode: ${{ needs.prepare.outputs.suffix != '' && 'unreleased' || 'version' }}
    outputs:
      release_body: ${{ steps.read_changelog.outputs.release_body }}

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.skip != 'true' }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm, macos-latest]
    concurrency:
      group: release-build-${{ matrix.os }}-${{ github.ref_name }}
      cancel-in-progress: true
    runs-on: ${{ matrix.os }}
    env:
      # `nix/releaseVersion.nix` reads this (with `--impure`) so the artifacts
      # are named after, and report, the release version rather than the
      # changelog version.
      MOTOKO_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - if: ${{ startsWith(matrix.os, 'ubuntu-') }}
        uses: nixbuild/nixbuild-action@ccd11ee76c26c018e8470835dc2e286a5a024a14 # v27
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}
          generate_summary_for: 'workflow'
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ic-hs-test
          # NB: No auth token, we don't expect to push new stuff here

      - name: Build platform-specific release files
        shell: bash
        run: |
          release_files="$(${{ github.workspace }}/nixbuildcopy.sh --impure '.#"release-files-${{ matrix.os }}"')"
          echo "UPLOAD_PATH=$release_files" >> $GITHUB_ENV

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-files-${{ matrix.os }}
          path: ${{ env.UPLOAD_PATH }}/*

      - name: Test release files
        shell: bash
        run: |
          uname -s -m
          moc="$(${{ github.workspace }}/nixbuildcopy.sh --impure .#release.moc)"
          "$moc/bin/moc" --version
          file "$moc/bin/moc"
          ldd "$moc/bin/moc" || true

  publish:
    runs-on: ubuntu-latest
    needs: [prepare, changelog, build]
    if: ${{ needs.prepare.outputs.skip != 'true' }}
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          pattern: release-files-*
          merge-multiple: true

      - name: List downloaded files
        run: |
          echo "Contents of release-assets directory:"
          find release-assets -type f -ls || true

      - name: Create GitHub App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.GENERIC_CI_RW_APP_CLIENT_ID }}
          private-key: ${{ secrets.GENERIC_CI_RW_APP_PRIVATE_KEY }}
          repositories: motoko,node-motoko

      - name: Upload Release Assets
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ steps.app-token.outputs.token }}
          tag: ${{ needs.prepare.outputs.version }}
          file: release-assets/*
          file_glob: true
          body: ${{ needs.changelog.outputs.release_body || 'Draft release created for testing purposes' }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ needs.prepare.outputs.suffix != '' }}

      - name: Notify node-motoko of new release
        if: ${{ github.event_name == 'push' }}
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: caffeinelabs/node-motoko
          event-type: motoko-release
          client-payload: '{"version": "${{ needs.prepare.outputs.version }}"}'
