name: release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    # To test this workflow: Go to Actions -> release -> Run workflow
    # Or using the CLI: gh workflow run release --ref <branch> -f base_version=2.0.0 -f version_suffix=beta.0
    # This creates a draft release tagged with the computed version
    # Remember to delete the draft release after testing!
    inputs:
      base_version:
        description: "Base version to build, e.g. 2.0.0 (default: the first version in Changelog.md)"
        required: false
        default: ""
        type: string
      version_suffix:
        description: "Version suffix, e.g. beta.0 (together with the base version this makes the release version, e.g. 2.0.0-beta.0)"
        required: false
        default: test-draft-release
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # Resolve the version once, so every job agrees on it.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Abort if tag is not on master
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          git fetch origin master
          if git merge-base --is-ancestor "${GITHUB_SHA}" "origin/master"; then
            echo "Tag commit ${GITHUB_SHA} is reachable from master."
          else
            echo "Error: Tag commit ${GITHUB_SHA} is not on master. Aborting workflow."
            exit 1
          fi

      - name: Compute the release version
        id: version
        env:
          BASE_VERSION: ${{ inputs.base_version }}
          VERSION_SUFFIX: ${{ inputs.version_suffix }}
        run: |
          set -eu
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            version="${GITHUB_REF_NAME}"
          else
            base="${BASE_VERSION:-$(sed -nE 's/^## ([0-9]+\.[0-9]+\.[0-9]+) .*/\1/p' Changelog.md | head -n1)}"
            if ! printf '%s' "${base}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Error: base version must be MAJOR.MINOR.PATCH, e.g. 2.0.0 (got '${base}')"
              exit 1
            fi
            if ! printf '%s' "${VERSION_SUFFIX}" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9.-]*$'; then
              echo "Error: version_suffix must start with a letter or digit and contain only letters, digits, dots, and hyphens (got '${VERSION_SUFFIX}')"
              exit 1
            fi
            version="${base}-${VERSION_SUFFIX}"
          fi
          echo "Preparing release version=${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # A suffix is what makes a version a prerelease, and it is what the
          # release body and the GitHub release flags are chosen by.
          if [ "${version#*-}" != "${version}" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  # Check that the changelog is in good order and extract the changelog.
  changelog:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract changelog
        # A prerelease's entries have no `## <version> (date)` section yet, so
        # it gets the unreleased entries instead.
        id: read_changelog
        uses: ./.github/actions/extract-changelog
        with:
          version: ${{ needs.prepare.outputs.version }}
          mode: ${{ needs.prepare.outputs.prerelease == 'true' && 'unreleased' || 'version' }}
    outputs:
      release_body: ${{ steps.read_changelog.outputs.release_body }}

  build:
    needs: prepare
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm, macos-latest]
    concurrency:
      group: release-build-${{ matrix.os }}-${{ github.ref_name }}
      cancel-in-progress: true
    runs-on: ${{ matrix.os }}
    env:
      # nix/releaseVersion.nix reads this (needs `--impure`) so that the
      # artifacts are named after, and report, the release version rather than
      # the changelog version.
      MOTOKO_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - if: ${{ startsWith(matrix.os, 'ubuntu-') }}
        uses: nixbuild/nixbuild-action@ccd11ee76c26c018e8470835dc2e286a5a024a14 # v27
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}
          generate_summary_for: 'workflow'
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ic-hs-test
          # NB: No auth token, we don't expect to push new stuff here

      - name: Build platform-specific release files
        shell: bash
        run: |
          release_files="$(${{ github.workspace }}/nixbuildcopy.sh --impure '.#"release-files-${{ matrix.os }}"')"
          echo "UPLOAD_PATH=$release_files" >> $GITHUB_ENV

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-files-${{ matrix.os }}
          path: ${{ env.UPLOAD_PATH }}/*

      - name: Test release files
        shell: bash
        run: |
          uname -s -m
          moc="$(${{ github.workspace }}/nixbuildcopy.sh --impure .#release.moc)"
          "$moc/bin/moc" --version
          file "$moc/bin/moc"
          ldd "$moc/bin/moc" || true

  publish:
    runs-on: ubuntu-latest
    needs: [prepare, changelog, build]
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          pattern: release-files-*
          merge-multiple: true

      - name: List downloaded files
        run: |
          echo "Contents of release-assets directory:"
          find release-assets -type f -ls || true

      - name: Create GitHub App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.GENERIC_CI_RW_APP_CLIENT_ID }}
          private-key: ${{ secrets.GENERIC_CI_RW_APP_PRIVATE_KEY }}
          repositories: motoko,node-motoko

      - name: Upload Release Assets
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ steps.app-token.outputs.token }}
          tag: ${{ needs.prepare.outputs.version }}
          file: release-assets/*
          file_glob: true
          # Publishing a prerelease draft creates its tag, which runs this
          # workflow again as a `push` and re-uploads the same asset names.
          overwrite: true
          body: ${{ needs.changelog.outputs.release_body || 'Draft release created for testing purposes' }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' || github.event_name == 'workflow_dispatch' }}

      - name: Notify node-motoko of new release
        if: ${{ github.event_name == 'push' && needs.prepare.outputs.prerelease != 'true' }}
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: caffeinelabs/node-motoko
          event-type: motoko-release
          client-payload: '{"version": "${{ github.ref_name }}"}'
