[package]
name = "motoko-rts"
version = "0.1.0"
authors = ["dfinity <team-motoko@dfinity.org>"]
edition = "2024"

[lib]
crate-type = ["rlib"]
path = "../src/lib.rs"

[features]
ic = [] # Not used by RTS unit tests
memory_check = []
native_table = ["dep:native-table"]

[dependencies]
motoko-rts-macros = { path = "../../motoko-rts-macros" }
native-table = { path = "../../native-table/crates/native-table", optional = true }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
