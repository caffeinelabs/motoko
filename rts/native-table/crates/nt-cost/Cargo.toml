[package]
name = "nt-cost"
description = "Tests only: the cost_vs_ref wasm64 module, the crate's typed tree and its reference run side by side, and the table's maintenance units metered one at a time"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
# The unit meter reads the runner's count of the replica's instructions through an `env.nt_fuel_used` import
# (the `units` runner gives it); with `meter-notes`, the crate's maintenance decisions also tell the runner
# their look-ahead (`env.nt_note`), for its check of each.
fuel-meter = []
meter-notes = ["fuel-meter", "native-table/meter-notes"]

[dependencies]
nt-ref = { path = "../nt-ref" }
native-table = { path = "../native-table" }
